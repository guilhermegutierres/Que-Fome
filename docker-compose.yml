services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000

      ALIMENTOS_SOURCE: ${ALIMENTOS_SOURCE:-taco}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-taco-api-br1.p.rapidapi.com}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/alimentos?busca=arroz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_ALIMENTOS_SOURCE: ${VITE_ALIMENTOS_SOURCE:-supabase}
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
