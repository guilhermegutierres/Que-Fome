name: que-fome

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: que_fome_db
      POSTGRES_USER: que_fome_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_app_password
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/local-data:/restore:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U que_fome_admin -d que_fome_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  uploads-init:
    image: node:22-bookworm-slim
    restart: "no"
    entrypoint: ["node", "/seed-uploads.mjs"]
    volumes:
      - uploads:/uploads
      - ./docker/local-data/uploads:/backup:ro
      - ./docker/seed-uploads.mjs:/seed-uploads.mjs:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: que_fome_db
      DB_USER: que_fome_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      ALIMENTOS_SOURCE: postgres
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: "${APP_ORIGIN:-http://localhost:8080}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    secrets:
      - db_app_password
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/recipes?page=1&limit=1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  uploads:

secrets:
  db_admin_password:
    file: ./docker/secrets/db_admin_password.txt
  db_app_password:
    file: ./docker/secrets/db_app_password.txt
